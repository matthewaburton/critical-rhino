# Critical Rhino for tmux.
# Generated by scripts/build_tmux.py; don't edit by hand.
#
# Every color is one of the terminal's 16 or its own, never a fixed value, so tmux
# follows the terminal between dark and light. Highlights are reverse video: a
# palette color as the block, with text in the terminal's background color, which
# reads in both. tmux's defaults put black text on a color, about 2.5:1 in light.
#
# Source it from ~/.tmux.conf:
#   source-file ~/path/to/critical-rhino/extras/tmux/critical-rhino.conf

# The status bar on the terminal's own background
set -g status-style "fg=default,bg=default"

# Window names in blue
set -g window-status-style "fg=blue"

# The current window as a blue block
set -g window-status-current-style "fg=blue,bg=default,reverse"

# Gray borders, all red while input goes to every pane
set -g pane-border-style "#{?pane_synchronized,fg=red,fg=white}"

# The active pane's border in blue
set -g pane-active-border-style "#{?pane_synchronized,fg=red,fg=blue}"

# Messages as a yellow block, like the terminal's search highlight
set -g message-style "fg=yellow,bg=default,reverse"

# The command prompt
set -g message-command-style "fg=yellow,bg=default,reverse"

# The copy-mode selection and the selected row in choosers
set -g mode-style "fg=blue,bg=default,reverse"

# Search matches
set -g copy-mode-match-style "fg=yellow,bg=default,reverse"

# The current match (the terminal has no orange)
set -g copy-mode-current-match-style "fg=red,bg=default,reverse"

# The copy-mode mark
set -g copy-mode-mark-style "fg=magenta,bg=default,reverse"

# The selected menu item
set -g menu-selected-style "fg=blue,bg=default,reverse"
